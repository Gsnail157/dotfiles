set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Reset default prefix and bind new keys
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Key binds
# Reload tmux conf
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set vi-mode
set-window-option -g mode-keys vi

# New window will be on the same directory as the parent window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=color7, bg=default'
set -g status-right ''

set -g status-left '#S'
set -g status-left-style 'fg=color8'
set -g status-right-length 0
set -g status-left-length 100

setw -g window-status-current-style 'fg=white'
setw -g window-status-current-format '#[bold]#I:#[bold]#W'
setw -g window-status-style 'fg=color8'
